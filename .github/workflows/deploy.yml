name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        # Added --legacy-peer-deps to ignore React 18 vs 19 version mismatch
        run: npm ci --legacy-peer-deps

      - name: Build Application
        run: npm run build
        env:
          # Ensure these match the exact names in your project (e.g., REACT_APP_...)
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_BOOKS_API_URL: ${{ secrets.REACT_APP_BOOKS_API_URL }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Use './dist/' if you are using Vite, or './build/' for Create React App
          local-dir: ./build/ 
          # Absolute path on Hostinger
          server-dir: /home/u201583452/domains/smartedu.site/public_html/app/
          dangerous-clean-slate: false
